name: Deploy The Ark Spa & Salon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert master SVG to a normal JPG asset
        shell: python
        run: |
          import base64, re
          from pathlib import Path
          svg = Path('assets/master-design.svg').read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^\"]+)', svg)
          if not match:
              raise SystemExit('Embedded master JPEG not found')
          data = base64.b64decode(match.group(1))
          Path('assets/master-design.jpg').write_bytes(data)
          print(f'Created assets/master-design.jpg ({len(data)} bytes)')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
