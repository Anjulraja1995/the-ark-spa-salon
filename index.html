<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ark Spa & Salon | Vijay Nagar, Indore</title>
<meta name="description" content="The Ark Spa & Salon — Reducing Stress • Increasing Relaxation. Vijay Nagar, Indore.">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<main class="design-shell" id="home">
  <img class="master-design" src="assets/master-design.svg?v=15" alt="The Ark Spa & Salon" decoding="async">
  <nav class="hotspots" aria-label="Website navigation">
    <a class="hotspot home" href="#home" aria-label="Home"></a>
    <a class="hotspot about" href="#about" aria-label="About Us"></a>
    <a class="hotspot services" href="#services" aria-label="Services"></a>
    <a class="hotspot packages" href="#packages" aria-label="Packages"></a>
    <a class="hotspot gallery" href="#gallery" aria-label="Gallery"></a>
    <a class="hotspot offers" href="#offers" aria-label="Offers"></a>
    <a class="hotspot contact" href="#contact" aria-label="Contact Us"></a>
    <button class="hotspot book" type="button" data-book aria-label="Book Appointment"></button>
    <a class="hotspot call" href="tel:+919584885121" aria-label="Call The Ark Spa and Salon"></a>
    <a class="hotspot whatsapp" target="_blank" rel="noopener" href="https://wa.me/919584885121?text=Hello%20The%20Ark%20Spa%20%26%20Salon%2C%20I%20would%20like%20to%20book%20an%20appointment." aria-label="WhatsApp The Ark Spa and Salon"></a>
    <span class="hotspot services-target" id="services" aria-hidden="true"></span>
    <span class="hotspot packages-target" id="packages" aria-hidden="true"></span>
    <span class="hotspot gallery-target" id="gallery" aria-hidden="true"></span>
    <span class="hotspot offers-target" id="offers" aria-hidden="true"></span>
    <span class="hotspot about-target" id="about" aria-hidden="true"></span>
    <span class="hotspot contact-target" id="contact" aria-hidden="true"></span>
  </nav>
</main>

<dialog id="booking">
  <form method="dialog" class="booking-card">
    <button class="close" value="cancel" aria-label="Close">×</button>
    <p class="eyebrow">THE ARK</p>
    <h2>Book Appointment</h2>
    <p>Daily 11:00 AM – 9:00 PM</p>
    <input id="bname" required placeholder="Your name">
    <input id="bphone" required inputmode="tel" placeholder="Mobile number">
    <select id="bservice">
      <option>Massage Therapy</option>
      <option>Foot Therapy</option>
      <option>Scrubbed Therapy</option>
      <option>Asian Therapy</option>
    </select>
    <input id="bdate" type="date">
    <input id="btime" type="time">
    <button class="send" type="button" id="sendBooking">Send on WhatsApp</button>
  </form>
</dialog>

<script>
const dialog = document.getElementById('booking');
document.querySelectorAll('[data-book]').forEach(button => button.addEventListener('click', () => dialog.showModal()));
document.getElementById('sendBooking').addEventListener('click', () => {
  const name = document.getElementById('bname').value.trim();
  const phone = document.getElementById('bphone').value.trim();
  const service = document.getElementById('bservice').value;
  const date = document.getElementById('bdate').value || 'Not specified';
  const time = document.getElementById('btime').value || 'Not specified';
  if (!name || !phone) {
    alert('Please enter your name and mobile number.');
    return;
  }
  const message = `Hello The Ark Spa & Salon, I would like to book an appointment.\nName: ${name}\nMobile: ${phone}\nService: ${service}\nDate: ${date}\nTime: ${time}`;
  window.open('https://wa.me/919584885121?text=' + encodeURIComponent(message), '_blank', 'noopener');
  dialog.close();
});
</script>
</body>
</html>
